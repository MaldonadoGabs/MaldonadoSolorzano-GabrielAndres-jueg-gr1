<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Medieval - Plataformero 2D</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1410; overflow: hidden; }
  body { display: flex; justify-content: center; align-items: center; }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
<script>
const W = 960, H = 540;
const GROUND_H = 40;

class MainScene extends Phaser.Scene {
  constructor() { super('main'); }

  // ---------- Texturas generadas por código ----------
  makeTextures() {
    if (this.textures.exists('knight')) return;
    const g = this.make.graphics({ x: 0, y: 0, add: false });

    // Caballero (24x40)
    g.fillStyle(0x444444).fillRect(6, 30, 5, 10).fillRect(13, 30, 5, 10);   // piernas
    g.fillStyle(0x9aa3ad).fillRect(4, 14, 16, 18);                          // armadura
    g.fillStyle(0xb02a2a).fillRect(8, 16, 8, 14);                           // tabardo
    g.fillStyle(0xb8c0c8).fillRect(5, 2, 14, 13);                           // yelmo
    g.fillStyle(0x222222).fillRect(11, 7, 8, 3);                            // visor
    g.fillStyle(0xcc2222).fillRect(10, 0, 5, 3);                            // penacho
    g.generateTexture('knight', 24, 40);
    g.clear();

    // Enemigo (24x40)
    g.fillStyle(0x2b2b2b).fillRect(6, 30, 5, 10).fillRect(13, 30, 5, 10);
    g.fillStyle(0x5a2d4a).fillRect(4, 14, 16, 18);
    g.fillStyle(0x3a1a30).fillRect(8, 16, 8, 14);
    g.fillStyle(0x3b3b3b).fillRect(5, 2, 14, 13);
    g.fillStyle(0xff3333).fillRect(12, 7, 6, 2);
    g.generateTexture('enemy', 24, 40);
    g.clear();

    // Espada (40x8): hoja, guarda y empuñadura
    g.fillStyle(0xe8eef5).fillRect(10, 2, 30, 4);
    g.fillStyle(0xffffff).fillRect(10, 2, 30, 1);
    g.fillStyle(0xc9a227).fillRect(7, 0, 4, 8);
    g.fillStyle(0x6b3f1d).fillRect(0, 2, 7, 4);
    g.generateTexture('sword', 40, 8);
    g.clear();

    // Suelo (64x40)
    g.fillStyle(0x5a3d22).fillRect(0, 0, 64, 40);
    g.fillStyle(0x3f8f3a).fillRect(0, 0, 64, 8);
    g.fillStyle(0x45301b).fillRect(10, 20, 6, 4).fillRect(40, 28, 8, 4).fillRect(26, 14, 5, 3);
    g.generateTexture('ground', 64, 40);
    g.clear();

    // Plataforma de piedra (32x16)
    g.fillStyle(0x7b7b86).fillRect(0, 0, 32, 16);
    g.fillStyle(0x9a9aa6).fillRect(0, 0, 32, 3);
    g.fillStyle(0x55555e).fillRect(0, 15, 32, 1).fillRect(15, 3, 1, 12);
    g.generateTexture('plat', 32, 16);
    g.destroy();
  }

  // ---------- Fondo: cielo, montañas, castillo ----------
  makeBackground() {
    const g = this.add.graphics().setDepth(-10);
    g.fillGradientStyle(0x6fb1e8, 0x6fb1e8, 0xf3d9a4, 0xf3d9a4, 1);
    g.fillRect(0, 0, W, H);

    g.fillStyle(0xffffff, 0.8);
    [[120, 80, 90], [420, 55, 110], [760, 100, 80]].forEach(([x, y, w]) => {
      g.fillEllipse(x, y, w, 28).fillEllipse(x + 25, y - 10, w * 0.6, 26);
    });

    g.fillStyle(0x7d8fa8);
    g.fillTriangle(-50, H - GROUND_H, 200, 250, 450, H - GROUND_H);
    g.fillTriangle(250, H - GROUND_H, 520, 210, 800, H - GROUND_H);
    g.fillTriangle(600, H - GROUND_H, 850, 270, 1100, H - GROUND_H);

    // Castillo lejano
    g.fillStyle(0x4a4f63);
    const base = H - GROUND_H;
    g.fillRect(690, base - 150, 200, 150);
    g.fillRect(670, base - 220, 50, 220);
    g.fillRect(860, base - 220, 50, 220);
    for (let x = 670; x < 910; x += 16) {
      if ((x - 670) % 32 === 0) g.fillRect(x, base - 236, 12, 16);
    }
    for (let x = 690; x < 890; x += 20) {
      if ((x - 690) % 40 === 0) g.fillRect(x, base - 166, 14, 16);
    }
    g.fillStyle(0x23252f).fillRect(770, base - 70, 40, 70);
    g.fillStyle(0xf2c94c).fillRect(688, base - 190, 6, 14).fillRect(878, base - 190, 6, 14);
  }

  create() {
    this.over = false;
    this.score = 0;
    this.hp = 5;
    this.facing = 1;
    this.attacking = false;
    this.swing = -20;
    this.swingId = 0;
    this.invulUntil = 0;
    this.stunUntil = 0;

    this.makeTextures();
    this.makeBackground();

    // Plataformas (más bajas: ~80px entre niveles, el salto llega a ~150px)
    this.platforms = this.physics.add.staticGroup();
    const ground = this.add.tileSprite(W / 2, H - GROUND_H / 2, W, GROUND_H, 'ground');
    this.platforms.add(ground);

    [[150, 420, 160], [400, 340, 160], [680, 420, 160], [860, 340, 120], [600, 260, 140]]
      .forEach(([x, y, w]) => {
        const p = this.add.tileSprite(x, y, w, 16, 'plat');
        this.platforms.add(p);
        // Plataformas "de un solo sentido": se pueden atravesar saltando desde abajo
        p.body.checkCollision.down = false;
        p.body.checkCollision.left = false;
        p.body.checkCollision.right = false;
      });

    // Jugador
    this.player = this.physics.add.sprite(100, 400, 'knight');
    this.player.setCollideWorldBounds(true).setDepth(5);
    this.physics.add.collider(this.player, this.platforms);

    this.sword = this.add.image(0, 0, 'sword').setOrigin(0, 0.5).setDepth(6);

    // Enemigos
    this.enemies = this.physics.add.group();
    this.physics.add.collider(this.enemies, this.platforms);
    this.physics.add.overlap(this.player, this.enemies, (pl, en) => this.onPlayerHit(en));
    this.scheduleSpawn();

    // Controles
    this.cursors = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys('W,A,D,SPACE,J,X,Z,R');
    this.input.on('pointerdown', () => {
      if (this.over) this.scene.restart();
      else this.attack();
    });

    // HUD
    this.hud = this.add.text(16, 12, '', {
      fontFamily: 'Georgia, serif', fontSize: '22px', color: '#fff',
      stroke: '#2a1a0a', strokeThickness: 4
    }).setDepth(20);
    this.add.text(W - 16, 12,
      '← → / A D: mover   ↑ / W / Espacio: saltar   J / X / clic: atacar', {
      fontFamily: 'Georgia, serif', fontSize: '14px', color: '#fff',
      stroke: '#2a1a0a', strokeThickness: 3
    }).setOrigin(1, 0).setDepth(20);
    this.updateHud();
  }

  updateHud() {
    this.hud.setText('♥'.repeat(Math.max(this.hp, 0)) + '   Puntos: ' + this.score);
  }

  // ---------- Enemigos ----------
  scheduleSpawn() {
    this.time.delayedCall(Math.max(900, 2400 - this.score * 5), () => {
      if (this.over) return;
      if (this.enemies.countActive() < 8) this.spawnEnemy();
      this.scheduleSpawn();
    });
  }

  spawnEnemy() {
    const x = Math.random() < 0.5 ? 30 : W - 30;
    const e = this.enemies.create(x, 100, 'enemy');
    e.setCollideWorldBounds(true).setDepth(4);
    e.hp = 2;
    e.speed = Phaser.Math.Between(50, 95);
    e.stunUntil = 0;
    e.nextJump = 0;
    e.hitId = -1;
  }

  onPlayerHit(en) {
    const now = this.time.now;
    if (this.over || now < this.invulUntil || now < en.stunUntil) return;
    this.hp--;
    this.invulUntil = now + 1000;
    this.stunUntil = now + 250;
    const dir = Math.sign(this.player.x - en.x) || 1;
    this.player.setVelocity(dir * 300, -250);
    this.tweens.add({
      targets: this.player, alpha: 0.3, yoyo: true, repeat: 4, duration: 100,
      onComplete: () => this.player.setAlpha(1)
    });
    this.updateHud();
    if (this.hp <= 0) this.gameOver();
  }

  // ---------- Ataque con espada ----------
  attack() {
    if (this.over || this.attacking) return;
    this.attacking = true;
    this.swingId++;
    this.tweens.addCounter({
      from: -80, to: 60, duration: 180,
      onUpdate: t => { this.swing = t.getValue(); },
      onComplete: () => {
        this.attacking = false;
        this.swing = -20;
      }
    });
  }

  damageEnemy(e) {
    e.hitId = this.swingId;
    e.hp--;
    e.stunUntil = this.time.now + 300;
    e.setVelocity(this.facing * 260, -160);
    e.setTint(0xffffff);
    this.time.delayedCall(100, () => e.active && e.clearTint());
    if (e.hp <= 0) {
      this.score += 10;
      this.updateHud();
      const t = this.add.text(e.x, e.y - 20, '+10', {
        fontFamily: 'Georgia, serif', fontSize: '20px', color: '#ffd84a',
        stroke: '#000', strokeThickness: 3
      }).setOrigin(0.5).setDepth(20);
      this.tweens.add({
        targets: t, y: t.y - 35, alpha: 0, duration: 700,
        onComplete: () => t.destroy()
      });
      e.destroy();
    }
  }

  gameOver() {
    this.over = true;
    this.physics.pause();
    this.sword.setVisible(false);
    this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.6).setDepth(30);
    this.add.text(W / 2, H / 2 - 30, 'Has caído en batalla', {
      fontFamily: 'Georgia, serif', fontSize: '48px', color: '#ffd84a',
      stroke: '#000', strokeThickness: 6
    }).setOrigin(0.5).setDepth(31);
    this.add.text(W / 2, H / 2 + 30, 'Puntos: ' + this.score + '   —   R o clic para reiniciar', {
      fontFamily: 'Georgia, serif', fontSize: '22px', color: '#fff'
    }).setOrigin(0.5).setDepth(31);
  }

  // ---------- Bucle principal ----------
  update(time) {
    if (this.over) {
      if (Phaser.Input.Keyboard.JustDown(this.keys.R)) this.scene.restart();
      return;
    }
    const p = this.player, k = this.keys, c = this.cursors;

    // Movimiento
    if (time >= this.stunUntil) {
      const left = c.left.isDown || k.A.isDown;
      const right = c.right.isDown || k.D.isDown;
      if (left) { p.setVelocityX(-200); this.facing = -1; }
      else if (right) { p.setVelocityX(200); this.facing = 1; }
      else p.setVelocityX(0);
    }
    p.setFlipX(this.facing < 0);

    // Salto
    const onFloor = p.body.blocked.down || p.body.touching.down;
    if ((Phaser.Input.Keyboard.JustDown(c.up) || Phaser.Input.Keyboard.JustDown(k.W) ||
         Phaser.Input.Keyboard.JustDown(k.SPACE)) && onFloor) {
      p.setVelocityY(-520);
    }

    // Ataque
    if (Phaser.Input.Keyboard.JustDown(k.J) || Phaser.Input.Keyboard.JustDown(k.X) ||
        Phaser.Input.Keyboard.JustDown(k.Z)) this.attack();

    // Espada sigue al jugador
    this.sword.setPosition(p.x + this.facing * 6, p.y + 2);
    this.sword.setScale(this.facing, 1);
    this.sword.setAngle(this.facing * this.swing);

    // Enemigos
    this.enemies.getChildren().slice().forEach(e => {
      // Daño de la espada (solo una vez por golpe)
      if (this.attacking && e.hitId !== this.swingId) {
        const dx = (e.x - p.x) * this.facing;
        if (dx > -10 && dx < 70 && Math.abs(e.y - p.y) < 40) {
          this.damageEnemy(e);
          return;
        }
      }
      // IA muy simple: caminar hacia el jugador y saltar si está más arriba
      if (time >= e.stunUntil) {
        const dir = Math.sign(p.x - e.x);
        e.setVelocityX(dir * e.speed);
        e.setFlipX(dir < 0);
        if (p.y < e.y - 70 && (e.body.blocked.down || e.body.touching.down) && time > e.nextJump) {
          e.setVelocityY(-520);
          e.nextJump = time + 1500;
        }
      }
    });
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  width: W,
  height: H,
  backgroundColor: '#6fb1e8',
  physics: { default: 'arcade', arcade: { gravity: { y: 900 }, debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: MainScene
});
</script>
</body>
</html>
